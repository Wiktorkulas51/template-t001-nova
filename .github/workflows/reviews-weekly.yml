name: Reviews Weekly

on:
  # Harmonogram WYŁĄCZONY w starter-kicie: to baza szablonowa bez sekretów klienta,
  # cron odpalał się co poniedziałek i kończył błędem. Zostawiamy tylko ręczne
  # wywołanie (workflow_dispatch), a w kopii klienckiej odkomentuj schedule poniżej:
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-reviews-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-reviews-
      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: |
          npm ci
          npm run reviews:fetch
      - name: Commit updated reviews
        run: |
          if git diff --quiet src/data; then
            echo "Brak zmian w src/data, pomijam commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "chore: aktualizacja opinii Google (cron tygodniowy)"
            git push
          fi
