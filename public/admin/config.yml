  - name: global
    label: Ustawienia Globalne
    delete: false
    editor:
      preview: false
    files:
      - name: company
        label: Dane firmy
        file: src/data/global/company.json
        fields:
          - label: Pełna nazwa firmy
            name: fullName
            widget: string
          - label: Nazwa firmy (krótka)
            name: name
            widget: hidden
          - label: Branding / logo
            name: branding
            widget: object
            fields:
              - label: Ikona dekoracyjna
                name: icon
                widget: hidden
                options: *ref_0
                hint: Ikona Phosphor. Wybierz z listy, nie wpisuj ręcznie.
              - label: Krój pisma
                name: font
                widget: hidden
              - label: Nadtytuł (tagline)
                name: tagline
                widget: hidden
              - label: Plik logo (górny pasek i stopka)
                name: logoImage
                widget: image
                required: false
                media_library:
                  config:
                    accept:
                      - .png
                      - .svg
                      - .webp
                      - .jpg
                      - .jpeg
                hint: Wgraj logo (PNG/SVG). Wyświetla się w menu górnym i stopce.
              - label: Favicona (ikona przeglądarki)
                name: favicon
                widget: image
                required: false
                media_library:
                  config:
                    accept:
                      - .png
                      - .svg
                      - .ico
                      - .webp
                hint: >-
                  Wgraj faviconę (ikona w zakładce przeglądarki). Zalecany
                  format PNG/SVG, kwadrat.
              - label: LogoSuffix
                name: logoSuffix
                widget: hidden
          - label: Ulica i numer
            name: address
            widget: text
            hint: >-
              Podaj pełny adres w jednej linii, np. ul. Przykładowa 123, 00-001
              Warszawa
          - label: Kod pocztowy
            name: zipCode
            widget: hidden
          - label: Miasto
            name: city
            widget: hidden
          - label: Telefon
            name: phone
            widget: string
