            name: hours
            widget: string
          - label: NIP
            name: nip
            widget: string
          - label: KRS
            name: krs
            widget: string
          - label: URL strony
            name: siteUrl
            widget: hidden
          - label: Ustawienia SMTP (serwer poczty)
            name: smtp
            widget: hidden
            fields:
              - label: Host serwera SMTP
                name: smtpHost
                widget: string
              - label: Port serwera SMTP
                name: smtpPort
                widget: number
                value_type: int
              - label: Login SMTP
                name: smtpUser
                widget: string
          - label: Social media
            name: socials
            widget: object
            fields:
              - label: Facebook
                name: facebook
                widget: string
                required: false
                hint: >-
                  Wklej pełny link do profilu, np.
                  https://facebook.com/twoja-firma
              - label: Instagram
                name: instagram
                widget: string
                required: false
                hint: >-
                  Wklej pełny link do profilu, np.
