<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS</title>
</head>
<body>
  <!-- Backend produkcyjny: GitHub OAuth. Na localhost panel używa lokalnego proxy Decap. -->
  <!-- Polyfill crypto.randomUUID: Decap CMS go wymaga, a na HTTP (przed włączeniem SSL)
       kryptograficzne API nie jest dostępne w przeglądarce. Po włączeniu HTTPS można usunąć. -->
  <script>
    (function () {
      if (window.crypto && !window.crypto.randomUUID) {
        window.crypto.randomUUID = function () {
          var bytes = new Uint8Array(16);
          window.crypto.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = Array.prototype.map.call(bytes, function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
          return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
        };
      }
    })();
  </script>
  <script>
    (function () {
      var isLocal = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
      var configLink = document.createElement('link');
      configLink.rel = 'cms-config-url';
      configLink.type = 'text/yaml';
      configLink.href = isLocal ? '/admin/config.local.yml' : '/admin/config.yml';
      document.head.appendChild(configLink);
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.11.0/dist/decap-cms.js"></script>
</body>
</html>
