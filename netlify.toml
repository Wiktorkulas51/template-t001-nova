[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Preview deployment — kazdy branch to osobna domena
[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

# Branch deploy — dla staging/produkcja
[context.branch-deploy]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Netlify zawsze serwuje po HTTPS, więc HSTS jest tu bezpieczny.
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# build.assets = '_assets' (astro.config.mjs) kieruje czesc zasobow do /_assets/.
# Ten sam cache immutable co dla /assets/*, zeby podwojna sciezka nie lamala cache.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Przekierowania — trailing slash
[[redirects]]
  from = "/:path((?!.*\\.\\w+$).*)"
  to = "/:path/"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/404/"
  status = 404
